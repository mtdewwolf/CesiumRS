[package]
name = "cesium-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of CesiumJS (@cesium/engine 23.0.0), checked against CesiumJS fixtures."
license = "Apache-2.0"
publish = false
readme = "README.md"

[lib]
name = "cesium_rs"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
lerc-reader = { version = "0.5.0", default-features = false }
libm = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
# Compiles Cesium's IAU 2006 XYS tables (about 1.8 MB) into Iau2006XysData::bundled().
bundled-xys = []
