[package]
name = "cesium-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Rust port of CesiumJS (@cesium/engine 23.0.0), checked against CesiumJS fixtures."
license = "Apache-2.0"
publish = false
readme = "README.md"

[lib]
name = "cesium_rs"
crate-type = ["cdylib", "rlib"]

# The release profile is tuned for the wasm viewer (size first): it is what
# scripts/build-web.sh ships. Native performance work should use the bench
# profile below instead of changing these settings.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Native-speed profile for examples/benchmark.rs and ad-hoc profiling:
# `cargo run --profile bench --example benchmark`. Without it, the
# size-tuned release profile would understate native throughput.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16

[dependencies]
# crates.io basisu 0.1.0 depends on ruzstd 0.7 (RUSTSEC-2026-0344).
# mtdewwolf/basisu master @ 05fbe107 (PR #2) pins ruzstd 0.9.1. MSRV is 1.87.
basisu = { git = "https://github.com/mtdewwolf/basisu", rev = "05fbe10786751fb58b84d0b1af1e7852376a1110" }
flate2 = "1"
meshopt-rs = { version = "=0.1.2", features = ["experimental"] }
base64 = "0.22"
encoding_rs = "0.8"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
url = "2"
lerc-reader = { version = "0.5.0", default-features = false }
libm = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
punycode = "0.4.1"
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["HtmlVideoElement", "HtmlMediaElement", "Event", "EventTarget"] }

[features]
native-host = ["dep:ureq"]
browser = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
# Compiles Cesium's IAU 2006 XYS tables (about 1.8 MB) into Iau2006XysData::bundled().
bundled-xys = []

# Separate WASM validation artifact; no test exports enter the browser library.
[[example]]
name = "browser_validation"
crate-type = ["cdylib"]
required-features = ["browser"]

[[example]]
name = "renderer_validation"
crate-type = ["cdylib"]
required-features = ["browser"]

[[example]]
name = "renderer_completion_validation"
crate-type = ["cdylib"]
required-features = ["browser"]
