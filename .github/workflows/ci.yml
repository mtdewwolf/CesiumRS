name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: build, test, clippy, wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # idna_adapter 1.2.2 asks for 1.86, but this crate's MSRV is 1.97:
      # locked encoding_rs 0.8.42 / ICU 2.3 need 1.88, and s2_cell.rs calls
      # u64::isolate_lowest_one (stable in 1.97). Cargo.toml rust-version matches.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: cargo build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      - name: cargo build native-host
        run: cargo build --locked --features native-host

      - name: cargo test native-host
        run: cargo test --locked --features native-host

      # native-host is additive, so this also covers the default feature set.
      # Warnings are errors. --all-targets includes tests and examples.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --features native-host -- -D warnings

      # scripts/build-web.sh ships `cargo build --release --target wasm32-unknown-unknown`
      # (size-tuned LTO). CI compiles the same target without --release so the
      # cdylib still type-checks, without the release-profile link.
      - name: wasm build
        run: cargo build --locked --target wasm32-unknown-unknown

      # The browser feature pulls in wasm-bindgen. Same debug target as above.
      - name: wasm build browser
        run: cargo build --locked --target wasm32-unknown-unknown --features browser

      # The benchmark's raw host imports are linked separately from the library.
      - name: wasm benchmark build
        run: cargo build --locked --release --target wasm32-unknown-unknown --example parity_bench_wasm

      # Freshness of web/client/generated against a release wasm build.
      # Does not need a browser. The staged copy is uploaded so a stale
      # wasm.ts can be replaced with the bytes this job just built.
      - name: stage generated web bundle
        run: bash scripts/build-web.sh web/client/generated-fresh

      - name: upload generated web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-generated
          path: web/client/generated-fresh
          if-no-files-found: error

      - name: check generated web bundle
        run: bash scripts/check-generated.sh

      # scripts/check-browser-core.sh, scripts/check-renderer.sh, and
      # scripts/check-renderer-completion.sh are omitted. Each release-builds a
      # browser example, runs the wasm-bindgen 0.2.129 CLI, and drives headless
      # Chromium through tools/cesium (playwright-core, esbuild, @cesium/engine).
      # Those npm packages are not installed here, and the scripts launch
      # /usr/bin/chromium.

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

  clippy-stable:
    name: clippy stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --features native-host -- -D warnings

  # Prints a coverage summary. There is no coverage threshold, so the percentage
  # itself does not fail the job.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --all-targets --features native-host --summary-only
